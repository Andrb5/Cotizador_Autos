<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Autos</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --accent: #10b981;
            --bg: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        .form-section {
            padding: 2.5rem;
            flex: 1.5;
        }

        .result-section {
            background-color: var(--primary);
            color: white;
            padding: 2.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 12px;
            color: var(--text-light);
            font-weight: 600;
        }

        .suffix {
            position: absolute;
            right: 12px;
            color: var(--text-light);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
            background-color: #f8fafc;
            color: var(--text-dark);
            font-weight: 500;
        }

        input.has-prefix {
            padding-left: 28px;
        }

        input.has-suffix {
            padding-right: 28px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: #fff;
        }

        .result-box {
            margin-bottom: 2rem;
        }

        .result-box:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-value-large {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .result-value-small {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }

        .divider {
            height: 1px;
            background-color: #334155;
            margin: 1.5rem 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }
            .form-section, .result-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Sección de Ingreso de Datos -->
        <div class="form-section">
            <h2>Configura tu Financiamiento</h2>
            
            <div class="form-group">
                <label for="precio">Precio del Vehículo</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="precio" class="has-prefix" value="400000" step="1000" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="enganche">Enganche (Pago Inicial)</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="enganche" class="has-prefix" value="100000" step="1000" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="tasa">Tasa de Interés Anual</label>
                <div class="input-wrapper">
                    <input type="number" id="tasa" class="has-suffix" value="14.99" step="0.1" min="0">
                    <span class="suffix">%</span>
                </div>
            </div>

            <div class="form-group">
                <label for="plazo">Plazo del crédito</label>
                <select id="plazo">
                    <option value="12">12 meses</option>
                    <option value="24">24 meses</option>
                    <option value="36">36 meses</option>
                    <option value="48">48 meses</option>
                    <option value="60" selected>60 meses</option>
                    <option value="72">72 meses</option>
                </select>
            </div>
        </div>

        <!-- Sección de Resultados (Despeje de R) -->
        <div class="result-section">
            <div class="result-box">
                <div class="result-label">Monto a Financiar (Capital)</div>
                <p class="result-value-small" id="resMonto">$0.00</p>
            </div>

            <div class="divider"></div>

            <div class="result-box">
                <div class="result-label">Mensualidad Estimada</div>
                <p class="result-value-large" id="resMensualidad">$0.00</p>
            </div>
        </div>
    </div>

    <script>
        // Formateador de moneda
        const formatter = new Intl.NumberFormat('es-MX', {
            style: 'currency',
            currency: 'MXN'
        });

        function calcularCotizacion() {
            // 1. Obtener valores de los inputs
            const precio = parseFloat(document.getElementById('precio').value) || 0;
            const enganche = parseFloat(document.getElementById('enganche').value) || 0;
            const tasaAnual = parseFloat(document.getElementById('tasa').value) || 0;
            const plazoMeses = parseInt(document.getElementById('plazo').value);

            // 2. Lógica del concesionario
            // El Capital (Valor Presente) es lo que falta por pagar después del enganche
            let montoFinanciar = precio - enganche;
            
            // Validar que el enganche no sea mayor al precio
            if (montoFinanciar < 0) montoFinanciar = 0;

            // La tasa anual se divide entre 100 para hacerla decimal, y entre 12 para hacerla mensual
            const i = (tasaAnual / 100) / 12;
            const n = plazoMeses;

            let mensualidad = 0;

            // 3. Despeje de la fórmula de Anualidad Vencida para obtener el Pago (R)
            // Fórmula original: VP = R * [(1 - (1+i)^-n) / i]
            // Despejada: R = VP * [i / (1 - (1+i)^-n)]
            
            if (montoFinanciar > 0) {
                if (i === 0) {
                    // Si hay 0 meses sin intereses
                    mensualidad = montoFinanciar / n;
                } else {
                    mensualidad = montoFinanciar * (i / (1 - Math.pow(1 + i, -n)));
                }
            }

            // 4. Actualizar la interfaz (UI)
            document.getElementById('resMonto').innerText = formatter.format(montoFinanciar);
            document.getElementById('resMensualidad').innerText = formatter.format(mensualidad);
        }

        // Ejecutar el cálculo cuando cargue la página
        window.onload = calcularCotizacion;

        // Añadir "event listeners" para que se recalcule automáticamente al cambiar cualquier dato
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('input', calcularCotizacion);
        });
    </script>
</body>
</html>
